name: Deploy to GitHub Pages

# The public plane. The LAN deploy stays with Jenkins and is untouched: this builds the
# SAME source in public mode (PUBLIC_SITE=1) and never runs against the LAN host.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer commit win.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  PUBLIC_SITE: "1"
  SITE_URL: https://lariocpt.github.io
  BASE_PATH: /flawless-react-website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Same lineage as the tool's own CI (oven/bun:1.4). Below 1.4 concurrent
          # installers corrupt a shared cold cache, which on a runner reads as a registry
          # outage rather than what it is.
          bun-version: "1.4.3"

      - run: bun install --frozen-lockfile

      - name: Build (public mode)
        run: bun run build

      # The site's code blocks are hand-copied from the tool's docs and rot silently.
      # The published release is the bridge between them — the same gate the Jenkins
      # pipeline runs, against the public artifact instead of the LAN one.
      - name: Example gate
        run: |
          set -euo pipefail
          curl -fsSL -o fl-bin \
            https://github.com/lariocpt/flawless-react/releases/latest/download/flawless-react-linux-x64
          chmod +x fl-bin
          ./fl-bin --version
          node scripts/lint-examples.mjs "$PWD/fl-bin"

      # The inverse of the Jenkins Gate: that one fails if public references leak into a
      # LAN build; this one fails if a public build is missing them or still carries LAN
      # ones. Every check here has been seen to pass for the wrong reason at least once.
      - name: Gate (public build)
        run: |
          set -euo pipefail
          grep -rq 'github\.com/lariocpt/flawless-react' dist \
            || { echo "FAIL: public build has no repo link"; exit 1; }
          if grep -rlE '(apps|npm|crust|flawless-react)\.in\.drlario\.org' dist; then
            echo "FAIL: LAN references leaked into the public build (see files above)"
            exit 1
          fi
          grep -q 'rel="canonical" href="https://lariocpt.github.io/flawless-react-website/"' dist/index.html \
            || { echo "FAIL: canonical is not the public URL"; exit 1; }
          # _astro/ is a Jekyll-excluded directory; without .nojekyll the site deploys
          # unstyled.
          test -f dist/.nojekyll || { echo "FAIL: dist/.nojekyll missing"; exit 1; }
          # Every internal link must carry the base path, or it 404s under /flawless-react-website.
          if grep -rhoE '(href|src)="/(docs|favicon|_astro)[^"]*"' dist --include='*.html' | sort -u | grep .; then
            echo "FAIL: unbased internal links above would 404 under the base path"
            exit 1
          fi
          # An internal page link that omits the trailing slash still WORKS — Pages 301s it to
          # the slashed form Astro emits — which is why nothing catches it until a crawler does.
          # crust's post-deploy check found one of these on the first real run; this catches the
          # class before the deploy instead of after it.
          if grep -rhoE 'href="/[^"]*"' dist --include='*.html' \
             | grep -vE '/"' | grep -vE '\.(svg|ico|png|jpg|webp|css|js|xml|json|txt)"' \
             | sort -u | grep .; then
            echo "FAIL: internal links above lack a trailing slash and resolve through a 301"
            exit 1
          fi
          echo "gate passed: repo link present, no LAN leakage, canonical correct, links based"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Dogfooding: a public tool checks the public site that documents it. crust's
  # verify-web-links walks the sitemap we just published.
  links:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: verify-web-links against the live site
        run: |
          set -euo pipefail
          curl -fsSL -o crust-bin \
            https://github.com/lariocpt/crust/releases/latest/download/crust-linux-x64
          chmod +x crust-bin
          # --sitemap, not --base-url: --base-url probes robots.txt at the ORIGIN, so on a
          # project Pages site it looks at lariocpt.github.io/robots.txt and finds nothing.
          #
          # Retry: this runs seconds after deploy-pages, and the CDN has served a 503 for a
          # freshly-published asset that was 200 moments later. A real broken link fails all
          # three attempts, so the gate keeps its teeth — this only absorbs lag.
          for attempt in 1 2 3; do
            if ./crust-bin -c "verify-web-links --sitemap https://lariocpt.github.io/flawless-react-website/sitemap-index.xml --concurrency 8 --timeout 15000"; then
              exit 0
            fi
            echo "link check attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          echo "FAIL: link check still failing after 3 attempts"
          exit 1
